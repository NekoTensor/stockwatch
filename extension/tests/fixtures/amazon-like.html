<!doctype html>
<!--
  Shape: a marketplace that publishes NO structured data at all - no JSON-LD,
  no microdata, no product:price meta - and buries the product in a page that is
  mostly navigation. This is what the store adapter's selectors exist for, and
  the ids below mirror the ones Amazon has used for years.
-->
<html lang="en">
  <head>
    <title>Amazon.in: Wireless Headphones</title>
  </head>
  <body>
    <header id="nav-belt"><a href="/">Amazon</a><span>Cart 0</span></header>
    <div id="dp-container">
      <div id="centerCol">
        <h1 id="title"><span id="productTitle">Acme Studio Wireless Headphones (Midnight Black)</span></h1>
        <a id="bylineInfo" href="/stores/acme">Visit the Acme Store</a>

        <div id="corePriceDisplay_desktop_feature_div">
          <span class="a-price"><span class="a-offscreen">₹8,499.00</span></span>
          <span class="basisPrice"><span class="a-offscreen">₹12,999.00</span></span>
        </div>

        <div id="availability"><span>In stock</span></div>

        <div id="variation_size_name">
          <ul>
            <li data-defaultasin="B0AAA00001" class="swatchAvailable"><span>Standard</span></li>
            <li data-defaultasin="B0AAA00002" class="swatchAvailable"><span>Pro</span></li>
            <li data-defaultasin="B0AAA00003" class="swatchUnavailable"><span>Max</span></li>
          </ul>
        </div>

        <div id="imgTagWrapperId"><img id="landingImage" src="/images/headphones.jpg" alt="Acme headphones" /></div>
      </div>
    </div>
  </body>
</html>
