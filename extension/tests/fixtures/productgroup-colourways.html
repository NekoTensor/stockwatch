<!doctype html>
<!--
  Shape: a schema.org ProductGroup whose `hasVariant` holds every COLOUR x SIZE
  combination, each a `@type: Product` with its own name, image and offer, and
  each offer carrying the URL of *its own colourway page*.

  Taken from the real structure H&M publishes. Three things about it break naive
  handling, and this fixture exists to keep all three fixed:

    1. The variants are richer-looking than the group that owns them, so a
       scorer that treats them as candidates picks one arbitrary size of one
       arbitrary colour - and then reports no sizes at all, because a leaf has
       no variants of its own.
    2. Colourways share the group. Unfiltered, navy's sold-out XS makes beige's
       XS look sold out, and navy's lower price becomes the beige price.
    3. The rendered size buttons are bare <div>s with hashed class names, no
       data attributes and no aria labels.

  The page URL is the BEIGE colourway (…001.html). Navy (…002.html) is cheaper
  and partly sold out, and must not contaminate the result.
-->

  <head>

    <meta property="og:url" content="https://www2.hm.com/en_in/productpage.1301837001.html" />
    <meta property="og:image" content="https://image.hm.com/assets/hm/henley-beige.jpg" />

    <script type="application/ld+json">

          { "@type": "ListItem", "position": 2, "name": "Men" },

          { "@type": "ListItem", "position": 4, "name": "Slim Fit Ribbed Henley shirt" }

    </script>
