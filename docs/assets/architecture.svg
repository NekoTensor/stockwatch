<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 250" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="960" height="250" fill="#ffffff" />

  <!-- boxes -->
  <g stroke="#cccccc" stroke-width="1" fill="none">
    <rect x="30"  y="50" width="150" height="120" />
    <rect x="210" y="50" width="150" height="120" />
    <rect x="390" y="50" width="150" height="120" />
    <rect x="570" y="50" width="150" height="120" />
    <rect x="750" y="50" width="150" height="120" />
  </g>

  <!-- arrows -->
  <g stroke="#000000" stroke-width="1">
    <line x1="184" y1="110" x2="206" y2="110" />
    <line x1="364" y1="110" x2="386" y2="110" />
    <line x1="544" y1="110" x2="566" y2="110" />
    <line x1="724" y1="110" x2="746" y2="110" />
  </g>
  <g fill="#000000">
    <path d="M 206 110 L 199 106 L 199 114 Z" />
    <path d="M 386 110 L 379 106 L 379 114 Z" />
    <path d="M 566 110 L 559 106 L 559 114 Z" />
    <path d="M 746 110 L 739 106 L 739 114 Z" />
  </g>

  <!-- box 1: browser -->
  <text x="105" y="100" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">YOUR BROWSER</text>
  <text x="105" y="126" text-anchor="middle" font-size="11" fill="#767676">Detect</text>
  <text x="105" y="142" text-anchor="middle" font-size="11" fill="#767676">Preview · Track</text>

  <!-- box 2: detection engine -->
  <text x="285" y="100" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">DETECTION</text>
  <text x="285" y="115" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">ENGINE</text>
  <text x="285" y="138" text-anchor="middle" font-size="11" fill="#767676">6 layers,</text>
  <text x="285" y="154" text-anchor="middle" font-size="11" fill="#767676">merged field-by-field</text>

  <!-- box 3: backend -->
  <text x="465" y="100" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">BACKEND</text>
  <text x="465" y="126" text-anchor="middle" font-size="11" fill="#767676">FastAPI</text>
  <text x="465" y="142" text-anchor="middle" font-size="11" fill="#767676">PostgreSQL</text>

  <!-- box 4: workers -->
  <text x="645" y="100" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">WORKERS</text>
  <text x="645" y="126" text-anchor="middle" font-size="11" fill="#767676">Celery · Redis</text>
  <text x="645" y="142" text-anchor="middle" font-size="11" fill="#767676">poll · compare</text>

  <!-- box 5: alerts -->
  <text x="825" y="100" text-anchor="middle" font-size="12" letter-spacing="1.5" fill="#000000">ALERTS</text>
  <text x="825" y="126" text-anchor="middle" font-size="11" fill="#767676">Browser</text>
  <text x="825" y="142" text-anchor="middle" font-size="11" fill="#767676">notification · Email</text>

  <!-- the six layers, called out under the engine box -->
  <text x="285" y="205" text-anchor="middle" font-size="10.5" letter-spacing="0.5" fill="#a3a3a3">JSON-LD · MICRODATA · EMBEDDED</text>
  <text x="285" y="221" text-anchor="middle" font-size="10.5" letter-spacing="0.5" fill="#a3a3a3">OPENGRAPH · DOM · META</text>
</svg>
